modal(`<div class="applicationModalV6"><div class="applicationHeadV6"><div><span>RAZA CLASSES · ${teacher?'TEACHER REGISTRATION':'STUDENT ADMISSION'}</span><h2>${teacher?'Create Teacher Account':'Create Student Account'}</h2><p>${teacher?'Complete your professional profile in four simple steps.':'Complete your academic application in four simple steps.'}</p></div><div class="applicationProgressV6"><b id="regStepNo">01</b><span id="regStepLabel">${teacher?'Personal Details':'Basic Details'}</span></div></div>

function registrationStep(delta){const form=document.getElementById('registrationFormV8');if(!form)return;const panels=[...form.querySelectorAll('.regStepPanelV6')],next=Math.max(1,Math.min(4,(window._registrationStep||1)+delta));if(delta>0){const current=panels[(window._registrationStep||1)-1];for(const el of current.querySelectorAll('input[required]')){if(!el.checkValidity()){el.reportValidity();return}}if(window._registrationStep===4)return}window._registrationStep=next;panels.forEach((p,i)=>p.classList.toggle('active',i===next-1));document.querySelectorAll('.regStepsV6 i').forEach((x,i)=>{x.classList.toggle('active',i<next);x.classList.toggle('current',i===next-1)});$('#regStepNo').textContent=String(next).padStart(2,'0');$('#regStepLabel').textContent=['Personal / Basic Details','Professional / Academic Details','Additional / Parent Details','Account'][next-1];$('#regHintV6').textContent=`Step ${next} of 4`;$('#regBack').style.display=next>1?'inline-flex':'none';$('#regNext').style.display=next<4?'inline-flex':'none';$('#regSubmit').style.display=next===4?'inline-flex':'none';}
async function doLogin(e,role){e.preventDefault();try{let x=Object.fromEntries(new FormData(e.target));x.role=role;let r=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});state.user=r.user;closeModal();await load()}catch(err){alert(err.message)}}
async function register(e,role='student'){
e.preventDefault();
const x=Object.fromEntries(new FormData(e.target));
x.role=role;
if(x.password!==x.confirmPassword){alert('Passwords do not match.');return}
delete x.confirmPassword;delete x.terms;
try{
 const file=e.target.elements.photoFile?.files?.[0];
 if(file){if(file.size>2*1024*1024){alert('Profile photo must be under 2 MB.');return}x.photo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
 delete x.photoFile;
 let r=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});
 state.user=r.user;closeModal();await load();
 alert(`🎉 ${role==='teacher'?'Teacher':'Student'} Account Created!\n\n${role==='teacher'?'Teacher ID':'Student ID'}: ${r.user.teacherId||r.user.studentId||'Generated'}\n\nWelcome to Raza Classes.`);
}catch(err){alert(err.message)}
}
function layout(active,content,admin,teacher){document.querySelector('.top').style.display='flex';$('#topActions').innerHTML=`<span class="muted small" style="margin-right:10px">${esc(state.user.name||'')}</span><button class="btn alt" onclick="logout()">Logout</button>`;let nav=admin?[['dash','🏠 Dashboard'],['students','👨‍🎓 Students'],['classes','📚 Classes & Subjects'],['material','📄 Materials'],['syllabus','📘 Syllabus'],['homeHighlights','✨ Home Highlights'],['exam','📝 Exam Adda'],['assign','📋 Assignments'],['tests','📝 Tests'],['quiz','🧠 Quiz'],['noticesWritten','📢 Written Notices'],['noticesImage','🖼️ Image Notices'],['settings','⚙️ Settings']]:teacher?[['dash','🏠 Dashboard'],['profile','👨‍🏫 My Profile'],['classes','📚 My Classes'],['material','📄 Study Material'],['assign','📋 Assignments'],['tests','📝 Tests'],['quiz','🧠 Quiz'],['notices','📢 Notices'],['settings','⚙️ Account Settings']]:[['dash','🏠 Dashboard'],['ai','🤖 AI Study Assistant'],['profile','👤 My Profile'],['classes','📚 My Classes'],['material','📄 Study Material'],['assign','📋 Assignments'],['tests','📝 Tests'],['quiz','🧠 Quiz'],['notices','📢 Notices'],['exam','📝 Exam Adda'],['settings','⚙️ Account Settings']];$('#app').innerHTML=`<div class="shell"><aside><h3>${admin?'Admin Panel':teacher?'Teacher Portal':'Student Portal'}</h3><div class="nav">${nav.map(n=>`<button class="${active===n[0]?'active':''}" onclick="page('${n[0]}')">${n[1]}</button>`).join('')}</div></aside><section class="main">${content}</section></div>`}
function page(p){if(!state.user)return home();if(state.user.role==='admin')adminPage(p);else if(state.user.role==='teacher')teacherPage(p);else studentPage(p)}

function statCard(a,n){return `<div class="card"><div class="muted">${a}</div><div class="stat">${n}</div></div>`}
function fileLink(f,label){if(!f?.data)return '';let href=`data:${f.type};base64,${f.data}`;return `<a class="btn alt" href="${href}" download="${esc(f.filename||label)}">⬇ ${esc(label||f.filename)}</a>`}
function noticeCard(n,img=false){return `<div class="item ${n.type==='written'?'notice':''}"><h3>${esc(n.title)}</h3>${n.type==='image'&&n.file?`<img class="thumb" src="data:${esc(n.file.type)};base64,${n.file.data}">`:''}${n.body?`<p>${esc(n.body)}</p>`:''}<div class="muted small">${n.audience==='home'?'Home':n.audience==='both'?'Home + Student Dashboard':n.audience==='class'?'Class: '+esc(n.className):n.audience==='students'?'Selected Students':'—'}</div></div>`}
function aiDemoAnswer(q){let t=String(q||'').trim();if(!t)return 'Apna question likho, main use step-by-step samajhne mein help karunga.';let l=t.toLowerCase();if(l.includes('photosynthesis'))return 'Photosynthesis mein plants sunlight ki help se carbon dioxide aur water ko glucose aur oxygen mein convert karte hain. Simple formula: CO₂ + H₂O → Glucose + O₂ (light aur chlorophyll ki presence mein).';if(l.includes('real number'))return 'Real numbers mein rational aur irrational dono numbers aate hain. Example: 2, -3/4 aur √2 real numbers hain.';return 'Ye AI Study Assistant ka preview hai. Tumhara question receive ho gaya hai. Actual AI reasoning/API connection next step mein add karenge. Abhi tum topic, doubt, hint ya practice request likh sakte ho.';}
async function aiAsk(e){e.preventDefault();let f=new FormData(e.target),q=String(f.get('question')||'').trim();if(!q)return;let chat=document.getElementById('aiChat'),btn=e.target.querySelector('button[type=submit]');chat.insertAdjacentHTML('beforeend',`<div class="aiMsg user">${esc(q)}</div><div class="aiMsg ai" id="aiTyping">🤖 Soch raha hoon…</div>`);e.target.reset();chat.scrollTop=chat.scrollHeight;if(btn){btn.disabled=true;btn.textContent='⏳ Thinking…'}try{let r=await api('/api/ai/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});document.getElementById('aiTyping')?.remove();chat.insertAdjacentHTML('beforeend',`<div class="aiMsg ai">${esc(r.answer).replace(/\n/g,'<br>')}</div>`)}catch(err){document.getElementById('aiTyping')?.remove();chat.insertAdjacentHTML('beforeend',`<div class="aiMsg ai">⚠️ ${esc(err.message||'AI response nahi aa saka.')}</div>`)}finally{if(btn){btn.disabled=false;btn.textContent='✨ Ask AI'}chat.scrollTop=chat.scrollHeight;}}

function qEditor(i,q={type:'mcq',text:'',options:['','','',''],answer:'',caseStudy:'',figure:null}){return `<div class="q"><div class="row"><b>Question ${i+1}</b><select data-q="type" onchange="toggleQType(this)"><option value="mcq" ${q.type==='mcq'?'selected':''}>MCQ</option><option value="very_short" ${q.type==='very_short'?'selected':''}>Very Short</option><option value="short" ${q.type==='short'?'selected':''}>Short Answer</option><option value="long" ${q.type==='long'?'selected':''}>Long Answer</option><option value="case_study" ${q.type==='case_study'?'selected':''}>Case Study</option><option value="figure" ${q.type==='figure'?'selected':''}>Figure / Image Question</option></select></div><textarea data-q="text" placeholder="Question text" required>${esc(q.text)}</textarea><div class="caseFields ${q.type==='case_study'?'':'hidden'}"><textarea data-q="caseStudy" placeholder="Case study passage / scenario">${esc(q.caseStudy||'')}</textarea></div><div class="figureFields ${q.type==='figure'?'':'hidden'}"><label>Upload figure / question image<input data-q="figure" type="file" accept="image/*"></label>${q.figure?.data?`<img class="thumb" src="data:${q.figure.type};base64,${q.figure.data}">`:''}</div><div class="mcqFields ${q.type==='mcq'?'':'hidden'}">${[0,1,2,3].map(j=>`<input data-q="o${j}" placeholder="Option ${String.fromCharCode(65+j)}" value="${esc(q.options?.[j]||'')}" ${q.type==='mcq'?'required':''}>`).join('')}<select data-q="answer">${[0,1,2,3].map(j=>`<option value="${j}" ${String(q.answer)===String(j)?'selected':''}>Correct: ${String.fromCharCode(65+j)}</option>`).join('')}</select></div><div class="answerFields ${['very_short','short'].includes(q.type)?'':'hidden'}"><input data-q="answerText" placeholder="Expected answer (for automatic checking)" value="${esc(q.answer||'')}"></div><div class="qHint muted small">Long and Case Study answers are saved for manual evaluation by admin.</div></div>`}
function toggleQType(sel){let q=sel.closest('.q'),v=sel.value;q.querySelector('.mcqFields').classList.toggle('hidden',v!=='mcq');q.querySelector('.answerFields').classList.toggle('hidden',!['very_short','short'].includes(v));q.querySelector('.caseFields').classList.toggle('hidden',v!=='case_study');q.querySelector('.figureFields').classList.toggle('hidden',v!=='figure');q.querySelectorAll('.mcqFields input').forEach(x=>x.required=v==='mcq');q.querySelector('.mcqFields select').required=v==='mcq'}
function addAssessment(type){let is=type==='tests';modal(`<h2>Create ${is?'Test':'Quiz'}</h2><form class="form" onsubmit="saveAssessment(event,'${type}')"><input name="title" placeholder="Title" required><input name="className" placeholder="Class (optional)"><textarea name="description" placeholder="Description"></textarea><div class="two"><input name="openAt" type="datetime-local" title="Open date/time"><input name="closeAt" type="datetime-local" title="Close date/time"></div><div class="two"><input name="duration" type="number" min="1" placeholder="Duration in minutes"><select name="status"><option value="closed">Do not open / Save as Draft</option><option value="open">Open / Publish</option></select></div><div id="questions"></div><div class="toolbar"><button type="button" class="btn alt" onclick="addQ()">+ Add Question</button><button type="button" class="btn alt" onclick="closeModal()">Cancel</button><button class="btn">Save ${is?'Test':'Quiz'}</button></div></form>`);addQ()}
function addQ(q){let box=$('#questions'),i=box.children.length;box.insertAdjacentHTML('beforeend',qEditor(i,q||undefined))}
async function collectQuestions(){let qs=[];for(const q of document.querySelectorAll('#questions .q')){let type=q.querySelector('[data-q=type]').value,answer=type==='mcq'?q.querySelector('[data-q=answer]').value:(q.querySelector('[data-q=answerText]')?.value||'');let item={type,text:q.querySelector('[data-q=text]').value,options:type==='mcq'?[0,1,2,3].map(i=>q.querySelector('[data-q=o'+i+']').value):[],answer,caseStudy:q.querySelector('[data-q=caseStudy]')?.value||'',figure:null};let file=q.querySelector('[data-q=figure]')?.files?.[0];if(file){item.figure=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve({filename:file.name,type:file.type,data:String(r.result).split(',')[1]});r.onerror=reject;r.readAsDataURL(file)})}qs.push(item)}return qs}
async function saveAssessment(e,type){e.preventDefault();let f=e.target,questions=await collectQuestions(),x={type:type==='quiz'?'quiz':'test',title:f.title.value,className:f.className.value,description:f.description.value,openAt:f.openAt.value?new Date(f.openAt.value).toISOString():'',closeAt:f.closeAt.value?new Date(f.closeAt.value).toISOString():'',duration:f.duration.value,published:f.status.value==='open',questions};try{await api('/api/admin/assessment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});closeModal();await load();page(type)}catch(err){alert(err.message)}}
function editAssessment(type,id){let arr=type==='tests'?state.data.tests:state.data.quizzes,x=arr.find(a=>a.id===id);modal(`<h2>Edit / Open-Close: ${esc(x.title)}</h2><p class="muted">This version keeps the original questions. To change questions, create a new assessment.</p><form class="form" onsubmit="saveAssessmentEdit(event,'${type}','${id}')"><input name="openAt" type="datetime-local" value="${x.openAt?new Date(x.openAt).toISOString().slice(0,16):''}"><input name="closeAt" type="datetime-local" value="${x.closeAt?new Date(x.closeAt).toISOString().slice(0,16):''}"><input name="duration" type="number" min="1" value="${x.duration||''}" placeholder="Duration in minutes"><select name="status"><option value="closed" ${!x.published?'selected':''}>Do not open / Close</option><option value="open" ${x.published?'selected':''}>Open / Publish</option></select><button class="btn">Save</button></form>`)}
async function saveAssessmentEdit(e,type,id){e.preventDefault();let f=e.target;let key=type==='tests'?'tests':'quizzes',x=state.data[key].find(a=>a.id===id);let body={type:type==='quiz'?'quiz':'test',title:x.title,className:x.className,description:x.description,openAt:f.openAt.value?new Date(f.openAt.value).toISOString():'',closeAt:f.closeAt.value?new Date(f.closeAt.value).toISOString():'',duration:f.duration.value,published:f.status.value==='open',questions:x.questions};try{await api('/api/admin/assessment/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,key,data:body})});closeModal();await load();page(type)}catch(err){alert(err.message)}}

async function takeAssessment(type,id){let key=type==='tests'?'tests':'quizzes',x=state.data[key].find(z=>z.id===id);try{let st=await api('/api/assessment/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:type==='quiz'?'quiz':'test',id})});let deadline=st.duration?Date.now()+st.duration*60000:null;modal(`<div class="row"><h2>${esc(x.title)}</h2><button class="btn alt" onclick="closeModal()">×</button></div><div class="timer" id="timer">${st.duration?'Time: '+st.duration+':00':'No time limit'}</div><p class="muted">${esc(x.description||'')}</p><form class="form" onsubmit="submitAssessment(event,'${type}','${id}')">${x.questions.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.text)}</b>${q.caseStudy?`<div class="casebox"><b>Case Study:</b><br>${esc(q.caseStudy)}</div>`:''}${q.figure?.data?`<img class="questionFigure" src="data:${q.figure.type};base64,${q.figure.data}">`:''}${q.type==='mcq'?q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" required> ${esc(o)}</label>`).join(''):q.type==='very_short'?`<input name="q${i}" placeholder="Very short answer" required>`:q.type==='short'?`<input name="q${i}" placeholder="Short answer" required>`:`<textarea name="q${i}" rows="${q.type==='long'?'6':'8'}" placeholder="Write your answer" required></textarea>`}</div>`).join('')}<button class="btn">Submit ${type==='tests'?'Test':'Quiz'}</button></form>`);if(deadline){window.__timer=setInterval(()=>{let ms=Math.max(0,deadline-Date.now()),sec=Math.floor(ms/1000),m=Math.floor(sec/60),s=sec%60,el=$('#timer');if(el)el.textContent=`Time: ${m}:${String(s).padStart(2,'0')}`;if(ms<=0){clearInterval(window.__timer);let f=document.querySelector('.modalBox form');if(f)f.requestSubmit()}},500)}}catch(err){alert(err.message)}}
async function submitAssessment(e,type,id){e.preventDefault();if(window.__timer)clearInterval(window.__timer);let fd=new FormData(e.target),answers=[],i=0;while(fd.has('q'+i)){answers.push(fd.get('q'+i));i++}try{let r=await api('/api/'+(type==='tests'?'test':'quiz')+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[type==='tests'?'testId':'quizId']:id,answers})});closeModal();alert(`Auto score: ${r.score}/${r.total}${r.manual?`\n${r.manual} answer(s) need manual evaluation by admin.`:''}`);await load();page(type)}catch(err){alert(err.message)}}
function viewAssignmentSubmissions(id){let a=state.data.assignments.find(x=>x.id===id),subs=a?.submissions||[];modal(`<h2>Assignment Submissions — ${esc(a?.title||'')}</h2>${subs.map(s=>{let st=state.data.students.find(z=>z.id===s.studentId);return `<div class="item"><b>${esc(st?.name||'Student')}</b><div>${esc(st?.className||'')}</div>${s.note?`<p>${esc(s.note)}</p>`:''}${s.file?fileLink(s.file,'Download Submission'):''}<div class="muted small">${new Date(s.submittedAt).toLocaleString()}</div></div>`}).join('')||'<div class="empty">No submissions yet.</div>'}`)}
async function viewSubmissions(type,id){let key=type==='tests'?'tests':'quizzes',x=state.data[key].find(a=>a.id===id),subs=x.submissions||[];modal(`<h2>Submissions — ${esc(x.title)}</h2>${subs.map(s=>{let st=state.data.students.find(z=>z.id===s.studentId);return `<div class="item"><b>${esc(st?.name||'Student')}</b><div>Auto score: ${s.score}/${s.autoTotal??x.questions.filter(q=>['mcq','very_short','short'].includes(q.type)).length} · Manual review: ${x.questions.filter(q=>['long','case_study','figure'].includes(q.type)).length} question(s)</div><div class="muted small">${new Date(s.submittedAt).toLocaleString()}</div></div>`}).join('')||'<div class="empty">No submissions yet.</div>'}`)}
async function changePassword(e){e.preventDefault();try{await api('/api/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});alert('Password changed.')}catch(err){alert(err.message)}}
async function adminSettings(e){e.preventDefault();try{await api('/api/admin/settings',{method:'POST',body:new FormData(e.target)});alert('Settings saved.');await load();page('settings')}catch(err){alert(err.message)}}
// patch update route is handled below through a tiny helper request
(async()=>{try{let m=await api('/api/me');if(m.user){state.user=m.user;await load()}else home()}catch{home()}})();
</script>
