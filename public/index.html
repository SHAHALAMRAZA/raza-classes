function loginModal(role){modal(`<h2>${role==='admin'?'Admin Login':'Student Login'}</h2><form class="form" onsubmit="doLogin(event,'${role}')">${role==='admin'?'<input name="username" placeholder="Admin username" autocomplete="username" required>':'<input name="email" type="email" placeholder="Email" autocomplete="username" required>'}<input name="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn">Login</button></form><p class="muted small">${role==='student'?'New student? Click Create Student Account on the home screen.':''}</p>`)}
function registerModal(){modal(`<h2>Create Student Account</h2><form class="form" onsubmit="register(event)"><div class="two"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required></div><div class="two"><input name="className" placeholder="Class" required><input name="roll" placeholder="Roll number"></div><input name="phone" placeholder="Phone number"><input name="password" type="password" placeholder="Password (min 6 characters)" minlength="6" required><button class="btn">Create Account</button></form>`)}
async function doLogin(e,role){e.preventDefault();try{let x=Object.fromEntries(new FormData(e.target));x.role=role;let r=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});state.user=r.user;closeModal();await load()}catch(err){alert(err.message)}}
async function register(e){e.preventDefault();try{let r=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});state.user=r.user;closeModal();await load()}catch(err){alert(err.message)}}
function layout(active,content,admin){document.querySelector('.top').style.display='flex';$('#topActions').innerHTML=`<span class="muted small" style="margin-right:10px">${esc(state.user.name||'')}</span><button class="btn alt" onclick="logout()">Logout</button>`;let nav=admin?[['dash','🏠 Dashboard'],['students','👨‍🎓 Students'],['classes','📚 Classes & Subjects'],['material','📄 Materials'],['syllabus','📘 Syllabus'],['homeHighlights','✨ Home Highlights'],['exam','📝 Exam Adda'],['assign','📋 Assignments'],['tests','📝 Tests'],['quiz','🧠 Quiz'],['noticesWritten','📢 Written Notices'],['noticesImage','🖼️ Image Notices'],['settings','⚙️ Settings']]:[['dash','🏠 Dashboard'],['profile','👤 My Profile'],['classes','📚 My Classes'],['material','📄 Study Material'],['assign','📋 Assignments'],['tests','📝 Tests'],['quiz','🧠 Quiz'],['notices','📢 Notices'],['exam','📝 Exam Adda'],['settings','⚙️ Account Settings']];$('#app').innerHTML=`<div class="shell"><aside><h3>${admin?'Admin Panel':'Student Portal'}</h3><div class="nav">${nav.map(n=>`<button class="${active===n[0]?'active':''}" onclick="page('${n[0]}')">${n[1]}</button>`).join('')}</div></aside><section class="main">${content}</section></div>`}
function page(p){if(!state.user)return home();if(state.user.role==='admin')adminPage(p);else studentPage(p)}
function statCard(a,n){return `<div class="card"><div class="muted">${a}</div><div class="stat">${n}</div></div>`}
function fileLink(f,label){if(!f?.data)return '';let href=`data:${f.type};base64,${f.data}`;return `<a class="btn alt" href="${href}" download="${esc(f.filename||label)}">⬇ ${esc(label||f.filename)}</a>`}
function noticeCard(n,img=false){return `<div class="item ${n.type==='written'?'notice':''}"><h3>${esc(n.title)}</h3>${n.type==='image'&&n.file?`<img class="thumb" src="data:${esc(n.file.type)};base64,${n.file.data}">`:''}${n.body?`<p>${esc(n.body)}</p>`:''}<div class="muted small">${n.audience==='home'?'Home':n.audience==='both'?'Home + Student Dashboard':n.audience==='class'?'Class: '+esc(n.className):n.audience==='students'?'Selected Students':'—'}</div></div>`}
function studentPage(p){let d=state.data,s=d.student;if(p==='dash'){layout(p,`<div class="row"><div><h1>Welcome, ${esc(s.name)}</h1><p class="muted">Your learning space</p></div>${s.photo?`<img class="photo" src="data:${s.photo.type};base64,${s.photo.data}">`:''}</div><div class="grid">${statCard('Subjects / Classes',d.classes.length)}${statCard('Assignments',d.assignments.length)}${statCard('Tests + Quiz',d.tests.length+d.quizzes.length)}</div><div class="grid2" style="margin-top:15px"><div class="card"><h3>📢 Latest Notices</h3>${d.notices.slice(0,5).map(n=>noticeCard(n)).join('')||'<div class="empty">No notices.</div>'}</div><div class="card"><h3>📋 Assignments</h3>${d.assignments.slice(0,5).map(a=>`<div class="item"><b>${esc(a.title)}</b><div class="muted">${esc(a.className)} · Due ${esc(a.dueDate||'—')}</div>${a.file?fileLink(a.file,'Download'):''}</div>`).join('')||'<div class="empty">No assignments.</div>'}</div></div>`,false);return}
if(p==='profile'){layout(p,`<div class="card"><h2>My Profile</h2><div class="row"><div>${s.photo?`<img class="photo" src="data:${s.photo.type};base64,${s.photo.data}">`:'<div class="photo" style="display:grid;place-items:center">👤</div>'}</div><div class="muted">${esc(s.email)}</div></div><form class="form" style="margin-top:15px" enctype="multipart/form-data" onsubmit="saveProfile(event)"><input name="name" value="${esc(s.name)}" placeholder="Name"><input name="className" value="${esc(s.className)}" placeholder="Class"><input name="roll" value="${esc(s.roll)}" placeholder="Roll"><input name="phone" value="${esc(s.phone)}" placeholder="Phone"><input name="photo" type="file" accept="image/*"><button class="btn">Save Profile</button></form></div>`,false);return}
if(p==='classes'){let by={};d.classes.filter(c=>!c.name||c.name===s.className).forEach(c=>(by[c.subject]??=[]).push(c));layout(p,`<h1>My Classes</h1>${Object.keys(by).map(sub=>`<div class="card" style="margin-bottom:14px"><h3>${esc(sub)}</h3>${by[sub].map(c=>`<div class="item"><b>${esc(c.name)}</b>${(c.chapters||[]).map(ch=>`<div style="padding:8px 0 0 12px">📖 ${esc(ch.name)}</div>`).join('')||'<div class="muted">No chapters yet.</div>'}</div>`).join('')}</div>`).join('')||'<div class="card empty">No classes assigned yet.</div>'}`);return}
if(p==='material'){layout(p,`<h1>Study Material</h1>${d.materials.map(m=>`<div class="card" style="margin-bottom:12px"><div class="row"><div><h3>${esc(m.title)}</h3><div class="muted">${esc(m.kind)} · ${esc(m.subject||'')} ${m.chapterId?'· Chapter material':''}</div><p>${esc(m.description||'')}</p></div>${fileLink(m.file,'Open / Download')}</div></div>`).join('')||'<div class="card empty">No material yet.</div>'}`);return}
if(p==='assign'){layout(p,`<h1>Assignments</h1>${d.assignments.map(a=>`<div class="card" style="margin-bottom:12px"><h3>${esc(a.title)}</h3><p>${esc(a.description)}</p><div class="muted">${esc(a.className)} · Due ${esc(a.dueDate||'—')}</div><div class="toolbar" style="margin-top:10px">${fileLink(a.file,'Download Assignment')} ${a.submission?'<span class="pill">Submitted</span>':'<span class="pill">Pending</span>'}</div>${!a.submission?`<form class="form" enctype="multipart/form-data" onsubmit="submitAssignment(event,'${a.id}')"><textarea name="note" placeholder="Optional note"></textarea><input name="file" type="file" required><button class="btn">Submit Assignment</button></form>`:`<div class="muted small">Submitted on ${new Date(a.submission.submittedAt).toLocaleString()}</div>`}</div>`).join('')||'<div class="card empty">No assignments.</div>'}`);return}
if(p==='tests'||p==='quiz'){let arr=p==='tests'?d.tests:d.quizzes;layout(p,`<h1>${p==='tests'?'Tests':'Quiz'}</h1>${arr.map(x=>`<div class="card" style="margin-bottom:12px"><div class="row"><div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p></div><span class="pill">${x.questions.length} questions</span></div><div class="muted small">Duration: ${x.duration?x.duration+' min':'No limit'} · Opens: ${x.openAt?new Date(x.openAt).toLocaleString():'Now'} · Closes: ${x.closeAt?new Date(x.closeAt).toLocaleString():'No close time'}</div><button class="btn" style="margin-top:10px" onclick="takeAssessment('${p}','${x.id}')">Open ${p==='tests'?'Test':'Quiz'}</button></div>`).join('')||'<div class="card empty">Nothing is open right now.</div>'}`);return}
if(p==='notices'){layout(p,`<h1>Notices</h1>${d.notices.map(n=>noticeCard(n)).join('')||'<div class="card empty">No notices.</div>'}`);return}
if(p==='homeHighlights'){layout(p,`<div class="row"><h1>Home Highlights</h1><button class="btn" onclick="addHomeHighlight()">+ Upload Home Image</button></div><p class="muted">Festival, achievements, special moments and other images shown on the public homepage.</p>${(d.homeHighlights||[]).map(h=>`<div class="card" style="margin-bottom:12px"><h3>${esc(h.title)}</h3><img class="thumb" src="data:${esc(h.file.type)};base64,${h.file.data}">${h.description?`<p>${esc(h.description)}</p>`:''}<button class="btn danger" onclick="deleteHomeHighlight('${h.id}')">Delete</button></div>`).join('')||'<div class="card empty">No homepage images uploaded.</div>'}`,true);return}if(p==='exam'){layout(p,`<h1>Exam Adda</h1><div class="card">${d.examAdda?`<h2>${esc(d.examAdda.title)}</h2><p>${esc(d.examAdda.description||'')}</p>${fileLink(d.examAdda.file,'Open Main Exam PDF')}`:'<div class="empty">No exam PDF uploaded yet.</div>'}</div>`);return}
if(p==='settings'){layout(p,`<div class="card"><h2>Account Settings</h2><form class="form" onsubmit="changePassword(event)"><input name="currentPassword" type="password" placeholder="Current password" required><input name="newPassword" type="password" placeholder="New password" minlength="6" required><button class="btn">Change Password</button></form></div>`);return}}

if(p==='syllabus'){layout(p,`<h1>Syllabus</h1><div class="card"><form class="form" enctype="multipart/form-data" onsubmit="uploadSyllabus(event)"><input name="title" placeholder="Syllabus title" value="Syllabus"><input name="className" placeholder="Class (optional)"><input name="file" type="file" accept=".pdf" required><button class="btn">Upload Syllabus PDF</button></form>${d.syllabus?`<div class="item"><b>${esc(d.syllabus.title)}</b> · ${esc(d.syllabus.className||'All classes')}<br><br>${fileLink(d.syllabus.file,'Open Syllabus')}</div>`:''}</div>`,true);return}
if(p==='homeHighlights'){layout(p,`<div class="row"><h1>Home Highlights</h1><button class="btn" onclick="addHomeHighlight()">+ Upload Home Image</button></div><p class="muted">Festival, achievements, special moments and other images shown on the public homepage.</p>${(d.homeHighlights||[]).map(h=>`<div class="card" style="margin-bottom:12px"><h3>${esc(h.title)}</h3><img class="thumb" src="data:${esc(h.file.type)};base64,${h.file.data}">${h.description?`<p>${esc(h.description)}</p>`:''}<button class="btn danger" onclick="deleteHomeHighlight('${h.id}')">Delete</button></div>`).join('')||'<div class="card empty">No homepage images uploaded.</div>'}`,true);return}if(p==='exam'){layout(p,`<h1>Exam Adda</h1><div class="card"><form class="form" enctype="multipart/form-data" onsubmit="uploadExam(event)"><input name="title" placeholder="Section title" value="Exam Adda"><textarea name="description" placeholder="Description"></textarea><input name="file" type="file" accept=".pdf" required><button class="btn">Upload Main Exam PDF</button></form>${d.examAdda?`<div class="item"><b>${esc(d.examAdda.title)}</b><br>${esc(d.examAdda.description||'')}<br><br>${fileLink(d.examAdda.file,'Open Current PDF')}</div>`:''}</div>`,true);return}

async function logout(){await api('/api/logout',{method:'POST'});state.user=null;state.data=null;home()}
function addStudent(){modal(`<h2>Add Student</h2><form class="form" onsubmit="adminAddStudent(event)"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required><input name="className" placeholder="Class" required><input name="roll" placeholder="Roll"><input name="phone" placeholder="Phone"><input name="password" type="password" placeholder="Temporary password" minlength="6" required><button class="btn">Add</button></form>`)}

function qEditor(i,q={type:'mcq',text:'',options:['','','',''],answer:'',caseStudy:'',figure:null}){return `<div class="q"><div class="row"><b>Question ${i+1}</b><select data-q="type" onchange="toggleQType(this)"><option value="mcq" ${q.type==='mcq'?'selected':''}>MCQ</option><option value="very_short" ${q.type==='very_short'?'selected':''}>Very Short</option><option value="short" ${q.type==='short'?'selected':''}>Short Answer</option><option value="long" ${q.type==='long'?'selected':''}>Long Answer</option><option value="case_study" ${q.type==='case_study'?'selected':''}>Case Study</option><option value="figure" ${q.type==='figure'?'selected':''}>Figure / Image Question</option></select></div><textarea data-q="text" placeholder="Question text" required>${esc(q.text)}</textarea><div class="caseFields ${q.type==='case_study'?'':'hidden'}"><textarea data-q="caseStudy" placeholder="Case study passage / scenario">${esc(q.caseStudy||'')}</textarea></div><div class="figureFields ${q.type==='figure'?'':'hidden'}"><label>Upload figure / question image<input data-q="figure" type="file" accept="image/*"></label>${q.figure?.data?`<img class="thumb" src="data:${q.figure.type};base64,${q.figure.data}">`:''}</div><div class="mcqFields ${q.type==='mcq'?'':'hidden'}">${[0,1,2,3].map(j=>`<input data-q="o${j}" placeholder="Option ${String.fromCharCode(65+j)}" value="${esc(q.options?.[j]||'')}" ${q.type==='mcq'?'required':''}>`).join('')}<select data-q="answer">${[0,1,2,3].map(j=>`<option value="${j}" ${String(q.answer)===String(j)?'selected':''}>Correct: ${String.fromCharCode(65+j)}</option>`).join('')}</select></div><div class="answerFields ${['very_short','short'].includes(q.type)?'':'hidden'}"><input data-q="answerText" placeholder="Expected answer (for automatic checking)" value="${esc(q.answer||'')}"></div><div class="qHint muted small">Long and Case Study answers are saved for manual evaluation by admin.</div></div>`}
function toggleQType(sel){let q=sel.closest('.q'),v=sel.value;q.querySelector('.mcqFields').classList.toggle('hidden',v!=='mcq');q.querySelector('.answerFields').classList.toggle('hidden',!['very_short','short'].includes(v));q.querySelector('.caseFields').classList.toggle('hidden',v!=='case_study');q.querySelector('.figureFields').classList.toggle('hidden',v!=='figure');q.querySelectorAll('.mcqFields input').forEach(x=>x.required=v==='mcq');q.querySelector('.mcqFields select').required=v==='mcq'}
function addAssessment(type){let is=type==='tests';modal(`<h2>Create ${is?'Test':'Quiz'}</h2><form class="form" onsubmit="saveAssessment(event,'${type}')"><input name="title" placeholder="Title" required><input name="className" placeholder="Class (optional)"><textarea name="description" placeholder="Description"></textarea><div class="two"><input name="openAt" type="datetime-local" title="Open date/time"><input name="closeAt" type="datetime-local" title="Close date/time"></div><div class="two"><input name="duration" type="number" min="1" placeholder="Duration in minutes"><select name="status"><option value="closed">Do not open / Save as Draft</option><option value="open">Open / Publish</option></select></div><div id="questions"></div><div class="toolbar"><button type="button" class="btn alt" onclick="addQ()">+ Add Question</button><button type="button" class="btn alt" onclick="closeModal()">Cancel</button><button class="btn">Save ${is?'Test':'Quiz'}</button></div></form>`);addQ()}
function addQ(q){let box=$('#questions'),i=box.children.length;box.insertAdjacentHTML('beforeend',qEditor(i,q||undefined))}
async function collectQuestions(){let qs=[];for(const q of document.querySelectorAll('#questions .q')){let type=q.querySelector('[data-q=type]').value,answer=type==='mcq'?q.querySelector('[data-q=answer]').value:(q.querySelector('[data-q=answerText]')?.value||'');let item={type,text:q.querySelector('[data-q=text]').value,options:type==='mcq'?[0,1,2,3].map(i=>q.querySelector('[data-q=o'+i+']').value):[],answer,caseStudy:q.querySelector('[data-q=caseStudy]')?.value||'',figure:null};let file=q.querySelector('[data-q=figure]')?.files?.[0];if(file){item.figure=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve({filename:file.name,type:file.type,data:String(r.result).split(',')[1]});r.onerror=reject;r.readAsDataURL(file)})}qs.push(item)}return qs}
async function saveAssessment(e,type){e.preventDefault();let f=e.target,questions=await collectQuestions(),x={type:type==='quiz'?'quiz':'test',title:f.title.value,className:f.className.value,description:f.description.value,openAt:f.openAt.value?new Date(f.openAt.value).toISOString():'',closeAt:f.closeAt.value?new Date(f.closeAt.value).toISOString():'',duration:f.duration.value,published:f.status.value==='open',questions};try{await api('/api/admin/assessment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});closeModal();await load();page(type)}catch(err){alert(err.message)}}
function editAssessment(type,id){let arr=type==='tests'?state.data.tests:state.data.quizzes,x=arr.find(a=>a.id===id);modal(`<h2>Edit / Open-Close: ${esc(x.title)}</h2><p class="muted">This version keeps the original questions. To change questions, create a new assessment.</p><form class="form" onsubmit="saveAssessmentEdit(event,'${type}','${id}')"><input name="openAt" type="datetime-local" value="${x.openAt?new Date(x.openAt).toISOString().slice(0,16):''}"><input name="closeAt" type="datetime-local" value="${x.closeAt?new Date(x.closeAt).toISOString().slice(0,16):''}"><input name="duration" type="number" min="1" value="${x.duration||''}" placeholder="Duration in minutes"><select name="status"><option value="closed" ${!x.published?'selected':''}>Do not open / Close</option><option value="open" ${x.published?'selected':''}>Open / Publish</option></select><button class="btn">Save</button></form>`)}
async function saveAssessmentEdit(e,type,id){e.preventDefault();let f=e.target;let key=type==='tests'?'tests':'quizzes',x=state.data[key].find(a=>a.id===id);let body={type:type==='quiz'?'quiz':'test',title:x.title,className:x.className,description:x.description,openAt:f.openAt.value?new Date(f.openAt.value).toISOString():'',closeAt:f.closeAt.value?new Date(f.closeAt.value).toISOString():'',duration:f.duration.value,published:f.status.value==='open',questions:x.questions};try{await api('/api/admin/assessment/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,key,data:body})});closeModal();await load();page(type)}catch(err){alert(err.message)}}
function addHomeHighlight(){modal(`<h2>Upload Homepage Image</h2><form class="form" enctype="multipart/form-data" onsubmit="saveHomeHighlight(event)"><input name="title" placeholder="Title (e.g. Independence Day Celebration)" required><textarea name="description" placeholder="Short caption (optional)"></textarea><div class="filebox">Choose image<input name="file" type="file" accept="image/*" required></div><button class="btn">Publish on Homepage</button></form>`)}

function addNotice(type){let students=state.data.students;modal(`<h2>Create ${type==='image'?'Image':'Written'} Notice</h2><form class="form" enctype="multipart/form-data" onsubmit="saveNotice(event,'${type}')"><input name="title" placeholder="Notice title" required>${type==='written'?'<textarea name="body" placeholder="Notice details" required></textarea>':'<div class="filebox">Upload notice image<input name="file" type="file" accept="image/*" required></div>'}<select name="audience" onchange="audienceFields(this)"><option value="home">Home Screen</option><option value="students">Student Dashboard — Selected Students</option><option value="class">Student Dashboard — Entire Class</option><option value="both">Home + Student Dashboard</option></select><div id="audienceExtra"></div><button class="btn">Publish Notice</button></form>`)}
function audienceFields(s){let box=$('#audienceExtra');if(s.value==='students')box.innerHTML=`<select name="studentIds" multiple size="5">${state.data.students.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.className)}</option>`).join('')}</select><div class="muted small">Hold Ctrl to select multiple students.</div>`;else if(s.value==='class')box.innerHTML=`<select name="className"><option value="">Select class</option>${[...new Set(state.data.students.map(x=>x.className))].map(c=>`<option>${esc(c)}</option>`).join('')}</select>`;else box.innerHTML=''}
async function saveNotice(e,type){e.preventDefault();let fd=new FormData(e.target),ids=fd.getAll('studentIds');fd.delete('studentIds');fd.set('type',type);if(ids.length)fd.set('studentIds',ids.join(','));try{await api('/api/admin/notice',{method:'POST',body:fd});closeModal();await load();page(type==='image'?'noticesImage':'noticesWritten')}catch(err){alert(err.message)}}

async function takeAssessment(type,id){let key=type==='tests'?'tests':'quizzes',x=state.data[key].find(z=>z.id===id);try{let st=await api('/api/assessment/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:type==='quiz'?'quiz':'test',id})});let deadline=st.duration?Date.now()+st.duration*60000:null;modal(`<div class="row"><h2>${esc(x.title)}</h2><button class="btn alt" onclick="closeModal()">×</button></div><div class="timer" id="timer">${st.duration?'Time: '+st.duration+':00':'No time limit'}</div><p class="muted">${esc(x.description||'')}</p><form class="form" onsubmit="submitAssessment(event,'${type}','${id}')">${x.questions.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.text)}</b>${q.caseStudy?`<div class="casebox"><b>Case Study:</b><br>${esc(q.caseStudy)}</div>`:''}${q.figure?.data?`<img class="questionFigure" src="data:${q.figure.type};base64,${q.figure.data}">`:''}${q.type==='mcq'?q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" required> ${esc(o)}</label>`).join(''):q.type==='very_short'?`<input name="q${i}" placeholder="Very short answer" required>`:q.type==='short'?`<input name="q${i}" placeholder="Short answer" required>`:`<textarea name="q${i}" rows="${q.type==='long'?'6':'8'}" placeholder="Write your answer" required></textarea>`}</div>`).join('')}<button class="btn">Submit ${type==='tests'?'Test':'Quiz'}</button></form>`);if(deadline){window.__timer=setInterval(()=>{let ms=Math.max(0,deadline-Date.now()),sec=Math.floor(ms/1000),m=Math.floor(sec/60),s=sec%60,el=$('#timer');if(el)el.textContent=`Time: ${m}:${String(s).padStart(2,'0')}`;if(ms<=0){clearInterval(window.__timer);let f=document.querySelector('.modalBox form');if(f)f.requestSubmit()}},500)}}catch(err){alert(err.message)}}
async function submitAssessment(e,type,id){e.preventDefault();if(window.__timer)clearInterval(window.__timer);let fd=new FormData(e.target),answers=[],i=0;while(fd.has('q'+i)){answers.push(fd.get('q'+i));i++}try{let r=await api('/api/'+(type==='tests'?'test':'quiz')+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[type==='tests'?'testId':'quizId']:id,answers})});closeModal();alert(`Auto score: ${r.score}/${r.total}${r.manual?`\n${r.manual} answer(s) need manual evaluation by admin.`:''}`);await load();page(type)}catch(err){alert(err.message)}}
function viewAssignmentSubmissions(id){let a=state.data.assignments.find(x=>x.id===id),subs=a?.submissions||[];modal(`<h2>Assignment Submissions — ${esc(a?.title||'')}</h2>${subs.map(s=>{let st=state.data.students.find(z=>z.id===s.studentId);return `<div class="item"><b>${esc(st?.name||'Student')}</b><div>${esc(st?.className||'')}</div>${s.note?`<p>${esc(s.note)}</p>`:''}${s.file?fileLink(s.file,'Download Submission'):''}<div class="muted small">${new Date(s.submittedAt).toLocaleString()}</div></div>`}).join('')||'<div class="empty">No submissions yet.</div>'}`)}
async function viewSubmissions(type,id){let key=type==='tests'?'tests':'quizzes',x=state.data[key].find(a=>a.id===id),subs=x.submissions||[];modal(`<h2>Submissions — ${esc(x.title)}</h2>${subs.map(s=>{let st=state.data.students.find(z=>z.id===s.studentId);return `<div class="item"><b>${esc(st?.name||'Student')}</b><div>Auto score: ${s.score}/${s.autoTotal??x.questions.filter(q=>['mcq','very_short','short'].includes(q.type)).length} · Manual review: ${x.questions.filter(q=>['long','case_study','figure'].includes(q.type)).length} question(s)</div><div class="muted small">${new Date(s.submittedAt).toLocaleString()}</div></div>`}).join('')||'<div class="empty">No submissions yet.</div>'}`)}
